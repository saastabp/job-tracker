AWSTemplateFormatVersion: '2010-09-09'
Description: Job Tracker - Transient bastion (t4g.nano in public subnet) for SSM port-forwarding to RDS

Parameters:
  PublicSubnetIds:
    Type: AWS::SSM::Parameter::Value<List<AWS::EC2::Subnet::Id>>
    Default: /jobtracker/network/public-subnet-ids
  VpcId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::VPC::Id>
    Default: /jobtracker/network/vpc-id
  RdsSgId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::SecurityGroup::Id>
    Default: /jobtracker/network/rds-sg-id
  Al2023ArmAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Latest Amazon Linux 2023 ARM AMI (resolved by SSM at deploy time)
  PublicSubnetIndex:
    Type: Number
    Default: 0
    AllowedValues: [0, 1]
    Description: Which public subnet (0 or 1) to launch in. Switch to 1 if AZ 0 has no capacity for the chosen instance type.
  InstanceType:
    Type: String
    Default: t4g.nano
    AllowedValues: [t4g.nano, t4g.micro, t3.nano, t3.micro, t3a.nano, t3a.micro]
    Description: Bastion instance type. t4g.nano is cheapest. If both AZs are out, try t4g.micro, or x86 (t3/t3a)—but x86 needs the x86 AMI parameter, which this template doesn't switch.

Resources:

  BastionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'

  BastionInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref BastionRole]

  BastionSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Transient bastion for SSM port-forward to RDS (no inbound)
      VpcId: !Ref VpcId
      Tags:
        - { Key: Name, Value: jobtracker-bastion-sg }

  BastionToRdsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSgId
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref BastionSg
      Description: MySQL from jobtracker bastion (transient)

  Bastion:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref Al2023ArmAmi
      IamInstanceProfile: !Ref BastionInstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: '0'
          SubnetId: !Select [!Ref PublicSubnetIndex, !Ref PublicSubnetIds]
          GroupSet: [!Ref BastionSg]
      Tags:
        - { Key: Name, Value: jobtracker-bastion }

  SsmBastionInstanceId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /jobtracker/bastion/instance-id
      Type: String
      Value: !Ref Bastion

Outputs:
  BastionInstanceId:
    Value: !Ref Bastion