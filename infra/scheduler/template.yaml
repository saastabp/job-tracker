AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Job Tracker - scheduler stack (EventBridge Scheduler + follow-up notify Lambda + SES verified identity)

# This stack owns the follow-up reminder pipeline. It can be torn down without
# touching the api/data stacks: existing follow_ups rows persist, the dashboard
# pending count keeps working, only future reminders stop firing. Per
# stack-segregation rule (feedback_stacks).
#
# The notify Lambda runs OUTSIDE the VPC and never touches the DB — every
# field it needs (user_email, role_title, company_name, etc.) travels in the
# EventBridge schedule's Input payload, populated by the api-stack handlers
# at schedule-create time. This avoids needing an SES VPC interface endpoint
# (~$14/mo) and keeps the scheduler stack truly tearable-down.
#
# Order of operations on first deploy:
#   1. deploy-scheduler creates the SES email identity → AWS sends the user a
#      verification email; the user must click the link before any reminders
#      will send. Until verified, send_email calls fail with MessageRejected
#      and the notify Lambda raises (logged + DLQ-able later).
#   2. deploy-api re-runs to pick up the scheduler SSM params (group name,
#      notify ARN, exec role ARN) and grant the api Lambdas
#      scheduler:CreateSchedule on this group + iam:PassRole on the exec role.

Parameters:
  SenderEmail:
    Type: String
    Description: SES verified email used as both From and (in sandbox) the only allowed To. Defaults to the project owner's address.
    Default: saastabp@gmail.com

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 512
    Tracing: Disabled
    LoggingConfig:
      LogFormat: JSON

Resources:

  # SES verified identity — both sender and (sandbox) recipient. CloudFormation
  # creates the identity and AWS dispatches the verification email; the user
  # has to click the link before SES will accept SendEmail.
  SenderIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref SenderEmail

  # The schedule group is the namespace for our one-shot follow-up schedules.
  # Keeping a dedicated group keeps the api stack's IAM scope tight (it can
  # only Create/Delete schedules in this one group).
  FollowUpScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: jobtracker-followups

  # Role assumed by EventBridge Scheduler to invoke the notify Lambda when a
  # schedule fires. Scoped tightly to one Lambda + one schedule group.
  SchedulerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-notify-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt FollowUpNotifyFunction.Arn

  FollowUpNotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jobtracker-followup-notify
      CodeUri: ../../backend/src
      Handler: handlers.followup_notify.handler
      Environment:
        Variables:
          SENDER_EMAIL: !Ref SenderEmail
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderEmail}'

  # SSM parameters consumed by the api stack so its handlers can register
  # schedules in this group with this exec role + target. Empty defaults in
  # the api template mean: scheduler stack absent → handlers no-op silently.
  SsmSchedulerGroupName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /jobtracker/scheduler/group-name
      Type: String
      Value: !Ref FollowUpScheduleGroup

  SsmSchedulerNotifyArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /jobtracker/scheduler/notify-arn
      Type: String
      Value: !GetAtt FollowUpNotifyFunction.Arn

  SsmSchedulerRoleArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /jobtracker/scheduler/exec-role-arn
      Type: String
      Value: !GetAtt SchedulerExecutionRole.Arn

Outputs:
  ScheduleGroupName:
    Value: !Ref FollowUpScheduleGroup
  NotifyFunctionArn:
    Value: !GetAtt FollowUpNotifyFunction.Arn
  SchedulerExecutionRoleArn:
    Value: !GetAtt SchedulerExecutionRole.Arn
  SenderIdentity:
    Value: !Ref SenderIdentity
