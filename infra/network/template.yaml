AWSTemplateFormatVersion: '2010-09-09'
Description: Job Tracker - Network stack (VPC + subnets for the publicly-accessible RDS)

# Slice 07 flatten: every Lambda runs outside the VPC, so this stack now
# exists only because RDS instances must live in some VPC + subnet group.
# Two subnets in different AZs (DB Subnet Group requires ≥2 AZs), an IGW
# + default routes so RDS's PubliclyAccessible=true is actually reachable,
# and the security group RDS attaches to. No public-subnet infrastructure
# (no compute outside RDS), no S3 gateway endpoint (no in-VPC Lambdas).

Parameters:
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16

Resources:

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: jobtracker-vpc }

  DbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - { Key: Name, Value: jobtracker-db-a }
        - { Key: tier, Value: db }

  DbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - { Key: Name, Value: jobtracker-db-b }
        - { Key: tier, Value: db }

  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: jobtracker-igw }

  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw

  DbRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: jobtracker-db-rt-a }

  DbRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: jobtracker-db-rt-b }

  DbSubnetARtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref DbSubnetA, RouteTableId: !Ref DbRouteTableA }

  DbSubnetBRtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref DbSubnetB, RouteTableId: !Ref DbRouteTableB }

  # IGW default routes are what make RDS's PubliclyAccessible=true work —
  # without these, AWS still gives the instance a public IP and DNS name
  # but the subnets have no path for inbound traffic to land.
  DbDefaultRouteA:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref DbRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw

  DbDefaultRouteB:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref DbRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw

  RdsSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS MySQL ingress from anywhere (IAM auth + TLS gate access)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 0.0.0.0/0
          Description: MySQL from anywhere; IAM auth + TLS required
      Tags:
        - { Key: Name, Value: jobtracker-rds-sg }

  SsmVpcId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /jobtracker/network/vpc-id
      Type: String
      Value: !Ref Vpc

  SsmDbSubnetIds:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /jobtracker/network/db-subnet-ids
      Type: StringList
      Value: !Sub '${DbSubnetA},${DbSubnetB}'

  SsmRdsSgId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /jobtracker/network/rds-sg-id
      Type: String
      Value: !Ref RdsSg

Outputs:
  VpcId:
    Value: !Ref Vpc
  DbSubnetIds:
    Value: !Sub '${DbSubnetA},${DbSubnetB}'
  RdsSgId:
    Value: !Ref RdsSg
