AWSTemplateFormatVersion: '2010-09-09'
Description: Job Tracker - DNS stack (ACM cert + Route 53 alias for the SPA's custom domain). Deployed to us-east-1 because CloudFront requires its viewer certificate to live there. The hosted zone is global (Route 53), so the alias records are created in this stack regardless of where the rest of the app runs.

Parameters:
  HostedZoneId:
    Type: String
    Default: Z0729608URC9WKRYW5YI
    Description: Route 53 hosted zone ID for kololecat.link (the registrar-created zone whose NS records are the .link delegation target).
  AppDomain:
    Type: String
    Default: jobs.kololecat.link
    Description: Fully-qualified subdomain the SPA will be served from.
  CloudFrontDomainName:
    Type: String
    Description: The dXXXX.cloudfront.net domain of the SPA's CloudFront distribution. Supplied by the Makefile from /jobtracker/frontend/cloudfront-domain (us-west-2 SSM) at deploy time.

Resources:

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref AppDomain
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref AppDomain
          HostedZoneId: !Ref HostedZoneId

  Ipv4Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref AppDomain
      Type: A
      AliasTarget:
        DNSName: !Ref CloudFrontDomainName
        # Z2FDTNDATAQYW2 is the well-known global hosted zone ID for all
        # CloudFront distributions; do not parameterize.
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  Ipv6Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref AppDomain
      Type: AAAA
      AliasTarget:
        DNSName: !Ref CloudFrontDomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  CertificateArn:
    Value: !Ref Certificate
  AppDomain:
    Value: !Ref AppDomain
  AppUrl:
    Value: !Sub 'https://${AppDomain}'