AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Job Tracker - API stack (HTTP API Gateway, Cognito JWT auth, Lambda handlers)

Parameters:
  DbEndpoint:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /jobtracker/data/db-endpoint
  DbPort:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /jobtracker/data/db-port
  DbName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /jobtracker/data/db-name
  DbResourceId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /jobtracker/data/db-resource-id
  UserPoolClientId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /jobtracker/auth/spa-client-id
  UserPoolProviderUrl:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /jobtracker/auth/user-pool-provider-url
  UserPoolArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /jobtracker/auth/user-pool-arn
  ResumeBucketName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /jobtracker/data/resume-bucket-name
  ResumeBucketArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /jobtracker/data/resume-bucket-arn
  CorsOrigins:
    Type: CommaDelimitedList
    Default: 'http://localhost:5173'
    Description: Allowed CORS origins. After the frontend stack deploys, add the CloudFront URL via stack update.
  DbUser:
    Type: String
    Default: app
    Description: MySQL user that the Lambda authenticates as via RDS IAM. Must be created in MySQL after the data stack deploys (see README bootstrap step).
  SchedulerGroupName:
    Type: String
    Default: ''
    Description: EventBridge Scheduler group for follow-up reminders (from the scheduler stack). Empty = scheduler stack not deployed; api Lambdas will skip schedule writes silently.
  SchedulerNotifyArn:
    Type: String
    # Placeholder ARN-shaped default so cfn-lint's Resource-field regex passes
    # when the scheduler stack isn't deployed; HasScheduler keys off the
    # group name (empty default) for conditional inclusion of the policy.
    Default: 'arn:aws:lambda:us-west-2:000000000000:function:none'
    Description: ARN of the notify Lambda the scheduler invokes (from the scheduler stack). Inert default when SchedulerGroupName is empty.
  SchedulerRoleArn:
    Type: String
    Default: 'arn:aws:iam::000000000000:role/none'
    Description: ARN of the role EventBridge Scheduler assumes to invoke the notify Lambda (from the scheduler stack). Inert default when SchedulerGroupName is empty.
  GmailKmsKeyId:
    Type: String
    Default: ''
    Description: Gmail KMS key ID from /jobtracker/gmail/kms-key-id (gmail stack). Empty = gmail stack not deployed; OAuth routes are not registered.
  SpaUrl:
    Type: String
    Default: 'http://localhost:5173'
    Description: SPA base URL the OAuth callback redirects to after success/failure. Set by deploy-api / wire-frontend from /jobtracker/dns/app-url (preferred) or /jobtracker/frontend/cloudfront-url.

Conditions:
  HasScheduler: !Not [!Equals [!Ref SchedulerGroupName, '']]
  HasGmail: !Not [!Equals [!Ref GmailKmsKeyId, '']]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 512
    Tracing: Disabled
    LoggingConfig:
      LogFormat: JSON

Resources:

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: jobtracker-api
      CorsConfiguration:
        AllowOrigins: !Ref CorsOrigins
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 600
      Auth:
        Authorizers:
          CognitoAuth:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Ref UserPoolProviderUrl
              audience: [!Ref UserPoolClientId]
        DefaultAuthorizer: CognitoAuth

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jobtracker-health
      CodeUri: ../../backend/src
      Handler: handlers.health.handler
      Environment:
        Variables:
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET

  MigrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jobtracker-migrate
      CodeUri: ../../backend/src
      Handler: handlers.migrate.handler
      Timeout: 300
      Environment:
        Variables:
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jobtracker-post-confirmation
      CodeUri: ../../backend/src
      Handler: handlers.post_confirmation.handler
      Environment:
        Variables:
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'

  TargetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jobtracker-targets
      CodeUri: ../../backend/src
      Handler: handlers.targets.handler
      Environment:
        Variables:
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'
      Events:
        GetTargets:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /targets
            Method: GET
        PutTargets:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /targets
            Method: PUT

  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jobtracker-dashboard
      CodeUri: ../../backend/src
      Handler: handlers.dashboard.handler
      Environment:
        Variables:
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'
      Events:
        GetDashboardToday:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /dashboard/today
            Method: GET

  CompaniesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jobtracker-companies
      CodeUri: ../../backend/src
      Handler: handlers.companies.handler
      Environment:
        Variables:
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'
      Events:
        ListCompanies:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /companies
            Method: GET
        CreateCompany:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /companies
            Method: POST
        GetCompany:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /companies/{id}
            Method: GET
        UpdateCompany:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /companies/{id}
            Method: PUT

  SubmissionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jobtracker-submissions
      CodeUri: ../../backend/src
      Handler: handlers.submissions.handler
      Environment:
        Variables:
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          RESUME_BUCKET: !Ref ResumeBucketName
          SCHEDULER_GROUP_NAME: !Ref SchedulerGroupName
          SCHEDULER_NOTIFY_ARN: !Ref SchedulerNotifyArn
          SCHEDULER_ROLE_ARN: !Ref SchedulerRoleArn
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub '${ResumeBucketArn}/users/*'
        - !If
          - HasScheduler
          - Statement:
              - Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:UpdateSchedule
                  - scheduler:DeleteSchedule
                  - scheduler:GetSchedule
                Resource: !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${SchedulerGroupName}/*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Ref SchedulerRoleArn
                Condition:
                  StringLike:
                    iam:PassedToService: scheduler.amazonaws.com
          - !Ref AWS::NoValue
      Events:
        ListSubmissions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /submissions
            Method: GET
        CreateSubmission:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /submissions
            Method: POST
        GetSubmission:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /submissions/{id}
            Method: GET
        UpdateSubmission:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /submissions/{id}
            Method: PUT
        ReplaceSubmissionContacts:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /submissions/{id}/contacts
            Method: PUT

  FollowUpsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jobtracker-followups
      CodeUri: ../../backend/src
      Handler: handlers.followups.handler
      Environment:
        Variables:
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          SCHEDULER_GROUP_NAME: !Ref SchedulerGroupName
          SCHEDULER_NOTIFY_ARN: !Ref SchedulerNotifyArn
          SCHEDULER_ROLE_ARN: !Ref SchedulerRoleArn
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'
        - !If
          - HasScheduler
          - Statement:
              - Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:UpdateSchedule
                  - scheduler:DeleteSchedule
                  - scheduler:GetSchedule
                Resource: !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${SchedulerGroupName}/*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Ref SchedulerRoleArn
                Condition:
                  StringLike:
                    iam:PassedToService: scheduler.amazonaws.com
          - !Ref AWS::NoValue
      Events:
        ListFollowUps:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /follow-ups
            Method: GET
        CreateFollowUp:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /submissions/{id}/follow-ups
            Method: POST
        UpdateFollowUp:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /follow-ups/{id}
            Method: PUT
        DeleteFollowUp:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /follow-ups/{id}
            Method: DELETE

  ContactsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jobtracker-contacts
      CodeUri: ../../backend/src
      Handler: handlers.contacts.handler
      Environment:
        Variables:
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'
      Events:
        ListContacts:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /contacts
            Method: GET
        CreateContact:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /contacts
            Method: POST
        GetContact:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /contacts/{id}
            Method: GET
        UpdateContact:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /contacts/{id}
            Method: PUT
        DeleteContact:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /contacts/{id}
            Method: DELETE
        LogOutreach:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /contacts/{id}/outreach
            Method: POST
        DeleteOutreach:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /contacts/{contact_id}/outreach/{id}
            Method: DELETE

  ResumesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jobtracker-resumes
      CodeUri: ../../backend/src
      Handler: handlers.resumes.handler
      Environment:
        Variables:
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          RESUME_BUCKET: !Ref ResumeBucketName
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub '${ResumeBucketArn}/users/*'
      Events:
        ListResumes:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /resumes
            Method: GET
        CreateResume:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /resumes
            Method: POST
        GetResume:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /resumes/{id}
            Method: GET
        UpdateResume:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /resumes/{id}
            Method: PUT
        DeleteResume:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /resumes/{id}
            Method: DELETE
        ResumeUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /resumes/{id}/upload-url
            Method: POST
        RestoreResume:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /resumes/{id}/restore
            Method: POST
        PurgeResume:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /resumes/{id}/purge
            Method: POST

  # Gmail OAuth function — conditional on the gmail stack being deployed
  # (which publishes /jobtracker/gmail/kms-key-id, fetched by deploy-api
  # and passed in as GmailKmsKeyId). When gmail isn't deployed, the
  # function isn't created and the routes return 404 from API Gateway
  # before any Lambda involvement.
  #
  # Two routes, one Lambda. The /start route inherits the api's default
  # Cognito authorizer (the SPA invokes it with a JWT). The /callback
  # route is hit by Google's 302 redirect in the user's browser, which
  # carries no Authorization header — `Auth: Authorizer: NONE` overrides
  # the default. CSRF protection comes from the per-user state token
  # stored on `users.gmail_oauth_state` at /start time and validated at
  # /callback.
  GmailOAuthFunction:
    Type: AWS::Serverless::Function
    Condition: HasGmail
    Properties:
      FunctionName: jobtracker-gmail-oauth
      CodeUri: ../../backend/src
      Handler: handlers.gmail_oauth.handler
      Environment:
        Variables:
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          GMAIL_KMS_KEY_ID: !Ref GmailKmsKeyId
          GMAIL_OAUTH_CLIENT_SSM_PATH: '/jobtracker/gmail/oauth-client'
          SPA_REDIRECT_URL: !Ref SpaUrl
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'
            - Effect: Allow
              Action: kms:Encrypt
              Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/${GmailKmsKeyId}'
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jobtracker/gmail/oauth-client'
      Events:
        Start:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /integrations/gmail/oauth/start
            Method: GET
        Callback:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /integrations/gmail/oauth/callback
            Method: GET
            Auth:
              Authorizer: NONE

  # Gmail admin function — connection status, disconnect, link/unlink
  # thread for a submission. Same conditional pattern as GmailOAuthFunction:
  # only created when GmailKmsKeyId is non-empty (gmail stack deployed).
  # All four routes are Cognito-authenticated by the api's default
  # authorizer; no per-route overrides needed.
  GmailAdminFunction:
    Type: AWS::Serverless::Function
    Condition: HasGmail
    Properties:
      FunctionName: jobtracker-gmail-admin
      CodeUri: ../../backend/src
      Handler: handlers.gmail_admin.handler
      Environment:
        Variables:
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          GMAIL_KMS_KEY_ID: !Ref GmailKmsKeyId
          GMAIL_OAUTH_CLIENT_SSM_PATH: '/jobtracker/gmail/oauth-client'
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'
            - Effect: Allow
              # kms:Decrypt only — encryption happens in the OAuth callback
              # function (which has only kms:Encrypt). Different roles,
              # different perms.
              Action: kms:Decrypt
              Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/${GmailKmsKeyId}'
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jobtracker/gmail/oauth-client'
      Events:
        Status:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /integrations/gmail/status
            Method: GET
        Disconnect:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /integrations/gmail
            Method: DELETE
        LinkThread:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /submissions/{id}/gmail-link
            Method: PUT
        UnlinkThread:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /submissions/{id}/gmail-link
            Method: DELETE

  # Gmail compose function — POST /submissions/{id}/send. Sends a new
  # message (compose mode) or replies to an existing one (reply mode)
  # via the Gmail API. Optional resume PDF attachment fetched from the
  # resume S3 bucket. Conditional on the gmail stack being deployed.
  GmailComposeFunction:
    Type: AWS::Serverless::Function
    Condition: HasGmail
    Properties:
      FunctionName: jobtracker-gmail-compose
      CodeUri: ../../backend/src
      Handler: handlers.gmail_compose.handler
      Timeout: 60
      Environment:
        Variables:
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          GMAIL_KMS_KEY_ID: !Ref GmailKmsKeyId
          GMAIL_OAUTH_CLIENT_SSM_PATH: '/jobtracker/gmail/oauth-client'
          RESUME_BUCKET: !Ref ResumeBucketName
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'
            - Effect: Allow
              # kms:Decrypt for the refresh token. (The OAuth function
              # has Encrypt; the admin function has Decrypt; this one
              # has Decrypt too — different roles, scoped by need.)
              Action: kms:Decrypt
              Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/${GmailKmsKeyId}'
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jobtracker/gmail/oauth-client'
            - Effect: Allow
              # Read resume PDFs for attachment.
              Action: s3:GetObject
              Resource: !Sub '${ResumeBucketArn}/users/*'
      Events:
        Send:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /submissions/{id}/send
            Method: POST

  PostConfirmationCognitoPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PostConfirmationFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !Ref UserPoolArn

  SsmApiUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /jobtracker/api/url
      Type: String
      Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'

  SsmPostConfirmationFunctionArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /jobtracker/api/post-confirmation-function-arn
      Type: String
      Value: !GetAtt PostConfirmationFunction.Arn

Outputs:
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  HealthFunctionName:
    Value: !Ref HealthFunction
  MigrationFunctionName:
    Value: !Ref MigrationFunction
  PostConfirmationFunctionArn:
    Value: !GetAtt PostConfirmationFunction.Arn