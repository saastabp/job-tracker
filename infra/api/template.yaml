AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Job Tracker - API stack (HTTP API Gateway, Cognito JWT auth, Lambda handlers)

Parameters:
  PrivateSubnetIds:
    Type: AWS::SSM::Parameter::Value<List<AWS::EC2::Subnet::Id>>
    Default: /jobtracker/network/private-subnet-ids
  LambdaSgId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::SecurityGroup::Id>
    Default: /jobtracker/network/lambda-sg-id
  DbEndpoint:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /jobtracker/data/db-endpoint
  DbPort:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /jobtracker/data/db-port
  DbName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /jobtracker/data/db-name
  DbResourceId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /jobtracker/data/db-resource-id
  UserPoolClientId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /jobtracker/auth/spa-client-id
  UserPoolProviderUrl:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /jobtracker/auth/user-pool-provider-url
  UserPoolArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /jobtracker/auth/user-pool-arn
  ResumeBucketName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /jobtracker/data/resume-bucket-name
  ResumeBucketArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /jobtracker/data/resume-bucket-arn
  CorsOrigins:
    Type: CommaDelimitedList
    Default: 'http://localhost:5173'
    Description: Allowed CORS origins. After the frontend stack deploys, add the CloudFront URL via stack update.
  DbUser:
    Type: String
    Default: app
    Description: MySQL user that the Lambda authenticates as via RDS IAM. Must be created in MySQL after the data stack deploys (see README bootstrap step).

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 512
    Tracing: Disabled
    LoggingConfig:
      LogFormat: JSON

Resources:

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: jobtracker-api
      CorsConfiguration:
        AllowOrigins: !Ref CorsOrigins
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 600
      Auth:
        Authorizers:
          CognitoAuth:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Ref UserPoolProviderUrl
              audience: [!Ref UserPoolClientId]
        DefaultAuthorizer: CognitoAuth

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jobtracker-health
      CodeUri: ../../backend/src
      Handler: handlers.health.handler
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSgId]
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET

  MigrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jobtracker-migrate
      CodeUri: ../../backend/src
      Handler: handlers.migrate.handler
      Timeout: 300
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSgId]
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jobtracker-post-confirmation
      CodeUri: ../../backend/src
      Handler: handlers.post_confirmation.handler
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSgId]
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'

  TargetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jobtracker-targets
      CodeUri: ../../backend/src
      Handler: handlers.targets.handler
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSgId]
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'
      Events:
        GetTargets:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /targets
            Method: GET
        PutTargets:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /targets
            Method: PUT

  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jobtracker-dashboard
      CodeUri: ../../backend/src
      Handler: handlers.dashboard.handler
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSgId]
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'
      Events:
        GetDashboardToday:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /dashboard/today
            Method: GET

  CompaniesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jobtracker-companies
      CodeUri: ../../backend/src
      Handler: handlers.companies.handler
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSgId]
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'
      Events:
        ListCompanies:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /companies
            Method: GET
        CreateCompany:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /companies
            Method: POST
        GetCompany:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /companies/{id}
            Method: GET
        UpdateCompany:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /companies/{id}
            Method: PUT

  SubmissionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jobtracker-submissions
      CodeUri: ../../backend/src
      Handler: handlers.submissions.handler
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSgId]
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          RESUME_BUCKET: !Ref ResumeBucketName
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub '${ResumeBucketArn}/users/*'
      Events:
        ListSubmissions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /submissions
            Method: GET
        CreateSubmission:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /submissions
            Method: POST
        GetSubmission:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /submissions/{id}
            Method: GET
        UpdateSubmission:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /submissions/{id}
            Method: PUT

  ContactsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jobtracker-contacts
      CodeUri: ../../backend/src
      Handler: handlers.contacts.handler
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSgId]
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'
      Events:
        ListContacts:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /contacts
            Method: GET
        CreateContact:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /contacts
            Method: POST
        GetContact:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /contacts/{id}
            Method: GET
        UpdateContact:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /contacts/{id}
            Method: PUT
        DeleteContact:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /contacts/{id}
            Method: DELETE
        LogOutreach:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /contacts/{id}/outreach
            Method: POST
        DeleteOutreach:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /contacts/{contact_id}/outreach/{id}
            Method: DELETE

  ResumesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jobtracker-resumes
      CodeUri: ../../backend/src
      Handler: handlers.resumes.handler
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSgId]
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          RESUME_BUCKET: !Ref ResumeBucketName
          POWERTOOLS_SERVICE_NAME: jobtracker
          LOG_LEVEL: INFO
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub '${ResumeBucketArn}/users/*'
      Events:
        ListResumes:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /resumes
            Method: GET
        CreateResume:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /resumes
            Method: POST
        GetResume:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /resumes/{id}
            Method: GET
        UpdateResume:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /resumes/{id}
            Method: PUT
        DeleteResume:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /resumes/{id}
            Method: DELETE
        ResumeUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /resumes/{id}/upload-url
            Method: POST
        RestoreResume:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /resumes/{id}/restore
            Method: POST
        PurgeResume:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /resumes/{id}/purge
            Method: POST

  PostConfirmationCognitoPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PostConfirmationFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !Ref UserPoolArn

  SsmApiUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /jobtracker/api/url
      Type: String
      Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'

  SsmPostConfirmationFunctionArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /jobtracker/api/post-confirmation-function-arn
      Type: String
      Value: !GetAtt PostConfirmationFunction.Arn

Outputs:
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  HealthFunctionName:
    Value: !Ref HealthFunction
  MigrationFunctionName:
    Value: !Ref MigrationFunction
  PostConfirmationFunctionArn:
    Value: !GetAtt PostConfirmationFunction.Arn