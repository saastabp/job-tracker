[project]
name = "jobtracker-backend"
version = "0.1.0"
description = "Job Tracker Lambda backend"
requires-python = ">=3.12"
dependencies = [
    "aws-lambda-powertools>=3.0",
    "pymysql>=1.1",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"